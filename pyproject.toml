[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "debugger-mcp"
version = "0.9.3"
description = "A shared debugger for Agent-driven inspection and headless recipe-driven runtime actions across debugpy sessions."
requires-python = ">=3.9"
dependencies = ["debugpy>=1.8,<2"]

[project.scripts]
debugger-mcp = "debugger_mcp.__main__:main"
debugger-mcp-daemon = "debugger_mcp.daemon:main"

[tool.setuptools.packages.find]
include = ["debugger_mcp*"]
